# Default values for manar-web.
# This is a YAML-formatted file. Manifests only — this chart is not deployed
# by this phase (see docs/kubernetes.md). Assumes the whole Manar platform
# (manar-web, manar-api, Keycloak, ...) is deployed into one shared `manar`
# namespace, matching manar-api's own Helm chart's documented assumption.

replicaCount: 1

image:
  repository: manar-web
  pullPolicy: IfNotPresent
  # Overridden per-release (typically to a CI commit SHA) via --set
  # image.tag=... ; falls back to Chart.yaml's appVersion if unset.
  tag: ""
  # sha256:... from the release lock. When set it wins over tag (environments pin digests).
  digest: ""

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  automount: false
  annotations: {}
  name: ""

podAnnotations: {}
podLabels: {}

# Pod-level security context. uid/gid 1000 matches the Dockerfile's use of
# node:24-alpine's built-in unprivileged "node" user — NOT manar-api's 1001
# (that chart's runtime image uses a different base/user).
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  fsGroup: 1000
  seccompProfile:
    type: RuntimeDefault

# Container-level security context. readOnlyRootFilesystem is safe here:
# empirically verified (docker run --read-only --tmpfs /tmp) that the
# Next.js standalone runtime only ever writes to /tmp — no other path needs
# to be writable for the health check, a locale redirect, or a page render.
securityContext:
  allowPrivilegeEscalation: false
  privileged: false
  readOnlyRootFilesystem: true
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  capabilities:
    drop:
      - ALL
  seccompProfile:
    type: RuntimeDefault

service:
  type: ClusterIP
  port: 3000

# Reasonable defaults for a Next.js SSR app under moderate traffic. Tune per
# real load-test results before an actual deployment phase.
resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 512Mi

# Both liveness and readiness point at the same single /api/health endpoint
# — manar-web has no live/ready split (no DB/cache dependency to gate
# readiness on, see app/api/health/route.ts's own comment), unlike
# manar-api's /health/live + /health/ready convention.
livenessProbe:
  httpGet:
    path: /api/health
    port: http
  initialDelaySeconds: 10
  periodSeconds: 15
  timeoutSeconds: 5
  failureThreshold: 3

readinessProbe:
  httpGet:
    path: /api/health
    port: http
  initialDelaySeconds: 5
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3

# Only /tmp needs to be writable at runtime (see securityContext comment
# above) — mounted as an in-memory emptyDir since readOnlyRootFilesystem
# leaves no writable disk otherwise.
volumes:
  - name: tmp
    emptyDir: {}
  # Next.js writes its image and fetch caches under .next/cache at runtime;
  # the root filesystem is read-only.
  - name: next-cache
    emptyDir: {}

volumeMounts:
  - name: tmp
    mountPath: /tmp
  - name: next-cache
    mountPath: /app/.next/cache

nodeSelector: {}
tolerations: []
affinity: {}

# Soft (preferred, not required) pod anti-affinity spreads replicas across
# nodes when replicaCount > 1. Only applied when it's actually meaningful —
# a single replica has nothing to spread against. See templates/deployment.yaml.
podAntiAffinity:
  enabled: true

# Non-secret configuration, rendered into a ConfigMap and consumed via
# envFrom. Matches lib/env.ts's schema minus the three credential-shaped
# vars (SESSION_SECRET, OIDC_CLIENT_SECRET — see secrets.values below).
config:
  NODE_ENV: production
  # In-cluster manar-api Service DNS name, same convention already used by
  # this repo's own CI (.gitlab-ci.yml's api-client-drift-check job).
  MANAR_API_BASE_URL: "http://manar-api:3000"
  # The shared realm's issuer URL and the confidential client (spec 4.1).
  OIDC_ISSUER: ""
  OIDC_CLIENT_ID: "manar-api"
  APP_BASE_URL: ""
  # Product site linked from the public profile card.
  PUBLIC_SITE_URL: "https://manar.fixio.ae"

# Credential-shaped values, rendered into a Secret and consumed via envFrom.
# Real values must NEVER be set here / committed — this is a manifest-only
# phase (see docs/kubernetes.md). When secrets.create is true, this Secret
# is rendered with empty-string placeholders only, meant to be overwritten
# by a real secret-management tool (sealed-secrets, External Secrets
# Operator, etc.) or `helm upgrade --set-string secrets.values.xxx=...` at
# actual deploy time — never checked into values.yaml or any values file.
# When secrets.create is false, an externally-managed Secret object named
# secrets.existingSecretName is used instead (same escape-hatch pattern as
# manar-api's chart).
secrets:
  create: true
  existingSecretName: ""
  values:
    SESSION_SECRET: ""
    # The confidential client's secret in the realm named by config.OIDC_ISSUER.
    OIDC_CLIENT_SECRET: ""

# Voluntary disruptions (node drains, cluster upgrades) take at most this many
# pods at once. With one replica a drain still proceeds.
podDisruptionBudget:
  enabled: true
  maxUnavailable: 1

# The internal CA (cert-manager's manar-internal-ca). keycloak-internal-tls, the
# in-cluster route for the public Keycloak name, is signed by it, so the BFF's
# server-side token exchange needs it. Mounted read-only at
# /etc/manar/backing-service-ca; NODE_EXTRA_CA_CERTS points at `caKey`.
backingServiceTls:
  caSecretName: ""
  caKey: ca.crt

networkPolicy:
  # Per-app allow rules (templates/networkpolicy.yaml), keyed by name so an
  # overlay can switch one off (`<name>.enabled: false`), change its peers or
  # add one without restating the rest (Helm and Flux replace lists, merge maps).
  # Each value is { enabled?, ports, from } (ingress) or { enabled?, ports, to }
  # (egress) with raw NetworkPolicy peers.
  # Namespaces: manar-prod (apps), manar-platform (backing services),
  # kube-system (Traefik ingress, DNS); labels as set by manar/manar-infra.
  # manar-web only reaches manar-api and Keycloak: everything else is behind
  # manar-api's own API (docs/kubernetes.md).
  enabled: true
  ingress:
    # Browsers, through the Traefik ingress only.
    http:
      ports: [{ port: http, protocol: TCP }]
      from:
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: kube-system }
          podSelector:
            matchLabels:
              app.kubernetes.io/name: traefik
              app.kubernetes.io/instance: traefik-kube-system
  egress:
    # DNS (CoreDNS in kube-system). Kept even though the namespace policy in
    # manar/manar-infra also allows it, so the chart works on its own.
    dns:
      ports:
        - { port: 53, protocol: UDP }
        - { port: 53, protocol: TCP }
      to:
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: kube-system }
          podSelector:
            matchLabels: { k8s-app: kube-dns }
    manar-api:
      ports: [{ port: 3000, protocol: TCP }]
      to:
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: manar-prod }
          podSelector:
            matchLabels: { app.kubernetes.io/name: manar-api }
    keycloak:
      ports: [{ port: 8080, protocol: TCP }]
      to:
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: manar-platform }
          podSelector:
            matchLabels: { app.kubernetes.io/name: keycloak, app.kubernetes.io/instance: keycloak }
    # Keycloak through its public issuer (https://auth-manar.fixio.ae). manar-infra's
    # CoreDNS rewrite sends that name to traefik-internal (Traefik websecure, pod
    # port 8443), which serves keycloak-internal-tls from manar-internal-ca: set
    # backingServiceTls.caSecretName so the pods trust it. Without the rewrite the
    # name resolves to Cloudflare and goes out on 443 (external-https).
    keycloak-public:
      enabled: true
      ports: [{ port: 8443, protocol: TCP }]
      to:
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: kube-system }
          podSelector:
            matchLabels:
              app.kubernetes.io/name: traefik
              app.kubernetes.io/instance: traefik-kube-system
