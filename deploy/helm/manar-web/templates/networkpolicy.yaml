{{- /*
Per-app allow rules, values-driven (values.yaml networkPolicy.ingress and
networkPolicy.egress, maps of name -> { enabled?, ports, from|to } with raw
NetworkPolicy peers). An ingress rule with no `from` admits any source on its
ports. The namespace-level default-deny lives in the platform repo
(manar/manar-infra); this policy lists what this app needs on its own, so it
also works in a namespace without one.
*/}}
{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "manar-web.fullname" . }}
  labels:
    {{- include "manar-web.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "manar-web.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    {{- range $name, $rule := .Values.networkPolicy.ingress }}
    {{- if ne (toString $rule.enabled) "false" }}
    # {{ $name }}
    - ports:
        {{- toYaml .ports | nindent 8 }}
      {{- with .from }}
      from:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    {{- end }}
    {{- else }} []
    {{- end }}
  egress:
    {{- range $name, $rule := .Values.networkPolicy.egress }}
    {{- if ne (toString $rule.enabled) "false" }}
    # {{ $name }}
    - ports:
        {{- toYaml .ports | nindent 8 }}
      {{- with .to }}
      to:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    {{- end }}
    {{- else }} []
    {{- end }}
{{- end }}
