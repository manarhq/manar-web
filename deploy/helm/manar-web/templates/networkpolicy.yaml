{{- if .Values.networkPolicy.enabled }}
# manar-web's real dependency graph, per docs/kubernetes.md: it talks to
# manar-api (all business/domain logic lives behind that API) and directly
# to Keycloak (the BFF's OIDC/token exchange — see docs/auth-flow.md). It
# has NO direct dependency on Postgres/Redis/Kafka/OpenSearch/OpenBao/
# OpenFGA/Temporal/manar-ai/demo-soc-tools — all of that is manar-api's
# concern, reached only indirectly through manar-api's own API surface.
# This policy intentionally grants nothing beyond DNS + those two egress
# targets, and ingress only from the cluster's ingress controller.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "manar-web.fullname" . }}
  labels:
    {{- include "manar-web.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "manar-web.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              {{- toYaml .Values.networkPolicy.ingress.namespaceSelector | nindent 14 }}
      ports:
        - protocol: TCP
          port: {{ .Values.service.port }}
  egress:
    # DNS — every Pod needs this regardless of workload-specific egress.
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # manar-api — same namespace (single shared `manar` namespace, see
    # docs/kubernetes.md).
    - to:
        - podSelector:
            matchLabels:
              {{- toYaml .Values.networkPolicy.egress.manarApi.podSelector | nindent 14 }}
      ports:
        - protocol: TCP
          port: {{ .Values.networkPolicy.egress.manarApi.port }}
    # Keycloak — same namespace.
    - to:
        - podSelector:
            matchLabels:
              {{- toYaml .Values.networkPolicy.egress.keycloak.podSelector | nindent 14 }}
      ports:
        - protocol: TCP
          port: {{ .Values.networkPolicy.egress.keycloak.port }}
{{- end }}
