{{- if .Values.secrets.create }}
# Manifest-only placeholder: values.yaml's secrets.values default to empty
# strings and MUST stay that way in version control (see docs/kubernetes.md
# and the comment on secrets.values in values.yaml). Real secret material
# belongs in a real secret-management flow at actual deploy time, or set
# secrets.create=false and point secrets.existingSecretName at a
# Secret managed by sealed-secrets / External Secrets Operator / similar.
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "manar-web.fullname" . }}
  labels:
    {{- include "manar-web.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- range $key, $value := .Values.secrets.values }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
{{- end }}
