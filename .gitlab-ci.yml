stages:
  - lint
  - typecheck
  - test
  - build

# Shared setup for every job: pin the Node image, install pnpm via
# Corepack (bundled with Node) instead of piping the get.pnpm.io install
# script into a shell - Corepack fetches the exact version pinned in
# package.json's "packageManager" field from the npm registry, which
# verifies package integrity, and cache the pnpm content store keyed on
# the lockfile so `pnpm install` is fast on unchanged deps.
.pnpm:
  image: node:24-alpine
  variables:
    PNPM_HOME: "$CI_PROJECT_DIR/.pnpm"
  before_script:
    - export PATH="$PNPM_HOME/bin:$PATH"
    - corepack enable
    - corepack prepare --activate
    - pnpm config set store-dir .pnpm-store
    - pnpm install --frozen-lockfile
  cache:
    key:
      files:
        - pnpm-lock.yaml
    paths:
      - .pnpm-store

lint:
  extends: .pnpm
  stage: lint
  script:
    - pnpm lint
    - pnpm format:check

typecheck:
  extends: .pnpm
  stage: typecheck
  script:
    - pnpm typecheck

test:
  extends: .pnpm
  stage: test
  script:
    - pnpm test

build:
  extends: .pnpm
  stage: build
  script:
    - pnpm build
  artifacts:
    paths:
      - .next/standalone
      - .next/static
      - public
    expire_in: 1 day

# Phase 11a Part 2's drift check (mirrors manar-api's
# test/openapi-docs.e2e-spec.ts live-document suite): regenerate
# lib/api/schema.d.ts from a *live* manar-api and fail if it differs from
# what's committed — catches both hand-edited generated files and
# manar-api's surface changing without manar-web regenerating against it.
#
# Manual/allowed-to-fail here (not a required gate on every push) because
# manar-api is a separate repo/service this pipeline has no way to boot
# alongside it (its own Postgres/Keycloak/Redis/Kafka/OpenFGA/Temporal/
# OpenBao stack) — run it locally with `pnpm api:codegen:check` against a
# real `manar-api` dev server (`pnpm infra:up && pnpm start:dev` in that
# repo) before merging any change that depends on a new manar-api
# endpoint, and wire this job to a real manar-api CI environment once one
# exists.
api-client-drift-check:
  extends: .pnpm
  stage: test
  variables:
    MANAR_API_BASE_URL: "http://manar-api:3000"
  script:
    - pnpm api:codegen:check
  allow_failure: true
  when: manual
