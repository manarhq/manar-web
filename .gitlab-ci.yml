stages:
  - lint
  - typecheck
  - test
  - build
  - security

# Shared setup for every job: pin the Node image, install pnpm via
# Corepack (bundled with Node) instead of piping the get.pnpm.io install
# script into a shell - Corepack fetches the exact version pinned in
# package.json's "packageManager" field from the npm registry, which
# verifies package integrity, and cache the pnpm content store keyed on
# the lockfile so `pnpm install` is fast on unchanged deps.
.pnpm:
  image: ${CI_DEPENDENCY_PROXY_GROUP_IMAGE_PREFIX}/node:24-alpine@sha256:ebfe2f90462722a7a4de65e91990e97fe0d401c70e0e762c5b53302f905ec1c1
  variables:
    PNPM_HOME: "$CI_PROJECT_DIR/.pnpm"
  before_script:
    - export PATH="$PNPM_HOME/bin:$PATH"
    - corepack enable
    - corepack prepare --activate
    - pnpm config set store-dir .pnpm-store
    - pnpm install --frozen-lockfile
  # Jobs only read the pnpm store; lint is the one job that writes it back.
  cache: &pnpm-cache
    key:
      files:
        - pnpm-lock.yaml
    paths:
      - .pnpm-store
    policy: pull

# One pipeline per change on the shared runner: a branch with an open merge request runs only
# the merge request pipeline. main, tags and branches without an MR run as before.
workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - when: always

# The app build (and e2e where there is one): skipped in a merge request that only changes
# docs/. Every other pipeline (main, tags, branches) always runs them.
.code-rules:
  rules:
    - if: $CI_PIPELINE_SOURCE != "merge_request_event"
    - changes:
        # Every path except docs/: root files, then any top-level directory not named docs.
        - '*'
        - '[!d]*/**/*'
        - 'd[!o]*/**/*'
        - 'do[!c]*/**/*'
        - 'doc[!s]*/**/*'
        - 'docs?*/**/*'
        - '{d,do,doc}/**/*'

lint:
  extends: .pnpm
  stage: lint
  cache:
    <<: *pnpm-cache
    policy: pull-push
  script:
    - pnpm lint
    - pnpm format:check

typecheck:
  extends: .pnpm
  stage: typecheck
  needs: []
  script:
    - pnpm typecheck

test:
  extends: .pnpm
  stage: test
  needs: []
  script:
    - pnpm test

build:
  extends: .pnpm
  stage: build
  needs: []
  rules: !reference [.code-rules, rules]
  # Same build-only placeholders as the Dockerfile's build stage: `next build`
  # evaluates lib/env.ts while collecting page data, and these two vars have
  # no default. Never real secrets; the runtime gets real values from its
  # own secret store.
  variables:
    SESSION_SECRET: "00000000000000000000000000000000"
    MANAR_BFF_SERVICE_TOKEN: "0000000000000000"
  script:
    - pnpm build
  artifacts:
    paths:
      - .next/standalone
      - .next/static
      - public
    expire_in: 1 day

# Phase 11a Part 2's drift check (mirrors manar-api's
# test/openapi-docs.e2e-spec.ts live-document suite): regenerate
# lib/api/schema.d.ts from a *live* manar-api and fail if it differs from
# what's committed — catches both hand-edited generated files and
# manar-api's surface changing without manar-web regenerating against it.
#
# Manual/allowed-to-fail here (not a required gate on every push) because
# manar-api is a separate repo/service this pipeline has no way to boot
# alongside it (its own Postgres/Keycloak/Redis/Kafka/OpenFGA/Temporal/
# OpenBao stack) — run it locally with `pnpm api:codegen:check` against a
# real `manar-api` dev server (`pnpm infra:up && pnpm start:dev` in that
# repo) before merging any change that depends on a new manar-api
# endpoint, and wire this job to a real manar-api CI environment once one
# exists.
api-client-drift-check:
  extends: .pnpm
  stage: test
  variables:
    MANAR_API_BASE_URL: "http://manar-api:3000"
  script:
    - pnpm api:codegen:check
  allow_failure: true
  when: manual

# ---------------------------------------------------------------------------
# Security scanning (Phase 12b)
#
# Deferred all the way back in Phase 1 ("Security scanning stages are
# explicitly deferred... not stubbed with placeholders") — see
# docs/kubernetes.md for the full rationale, tool-version pinning, and
# severity-threshold policy summarized inline below. Every job here was
# actually run locally against this repo's real Dockerfile/source/lockfile/
# history before being wired in, not just written from docs.
# ---------------------------------------------------------------------------

# Builds the real production image (same Dockerfile the runtime deploys)
# once, and hands the tarball to every image-scanning job below via
# artifacts — so the image is only built once per pipeline, not once per
# scanner.
docker:build-images:
  stage: build
  needs: []
  image: ${CI_DEPENDENCY_PROXY_GROUP_IMAGE_PREFIX}/docker:29@sha256:0b6d18a4a222e71c88be6034926b4f6cde2fc33c2218643d03ccfddc65995470
  services:
    - name: ${CI_DEPENDENCY_PROXY_GROUP_IMAGE_PREFIX}/docker:29-dind@sha256:0b6d18a4a222e71c88be6034926b4f6cde2fc33c2218643d03ccfddc65995470
      alias: docker
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
  script:
    - docker build -t manar-web:ci .
    - docker save manar-web:ci -o manar-web-ci.tar
  artifacts:
    paths:
      - manar-web-ci.tar
    expire_in: 1 day

# Trivy (dependency + container image scanning), pinned aquasec/trivy:0.71.0.
# Policy (documented in docs/kubernetes.md): fail on HIGH/CRITICAL only,
# --ignore-unfixed (no point failing the build over a CVE with no fix to
# apply yet). The full JSON report is uploaded as an artifact unconditionally
# (artifacts: when: always), independent of whether the severity gate
# passes, so findings are always inspectable.
trivy-fs:
  stage: security
  needs: []
  image:
    name: ${CI_DEPENDENCY_PROXY_GROUP_IMAGE_PREFIX}/aquasec/trivy:0.71.0@sha256:016eae51fdcf989332a5404af7e8f625cd5d95d7c0907a221d080a996f556500
    entrypoint: [""]
  script:
    - trivy fs --scanners vuln,secret,misconfig --severity HIGH,CRITICAL --ignore-unfixed --format json --output trivy-fs-report.json --exit-code 0 .
    - trivy fs --scanners vuln,secret,misconfig --severity HIGH,CRITICAL --ignore-unfixed --format table --exit-code 1 .
  artifacts:
    when: always
    paths:
      - trivy-fs-report.json
    expire_in: 1 week

trivy-image:
  stage: security
  image:
    name: ${CI_DEPENDENCY_PROXY_GROUP_IMAGE_PREFIX}/aquasec/trivy:0.71.0@sha256:016eae51fdcf989332a5404af7e8f625cd5d95d7c0907a221d080a996f556500
    entrypoint: [""]
  needs:
    - docker:build-images
  script:
    - trivy image --input manar-web-ci.tar --scanners vuln --severity HIGH,CRITICAL --ignore-unfixed --format json --output trivy-image-report.json --exit-code 0
    - trivy image --input manar-web-ci.tar --scanners vuln --severity HIGH,CRITICAL --ignore-unfixed --format table --exit-code 1
  artifacts:
    when: always
    paths:
      - trivy-image-report.json
    expire_in: 1 week

# Gitleaks (secret scanning), pinned ghcr.io/gitleaks/gitleaks:v8.30.1.
# Scans full commit history (--log-opts="--all"), not just the working
# tree, so it also catches anything an earlier commit might have
# accidentally introduced and later "fixed" without ever purging history.
# Policy: fail on ANY finding not covered by an explicit, documented
# .gitleaks.toml allowlist entry (none exist as of Phase 12b — the full
# history scan is clean, see docs/kubernetes.md).
gitleaks:
  stage: security
  needs: []
  image:
    name: ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
    entrypoint: [""]
  variables:
    GIT_STRATEGY: clone
    GIT_DEPTH: 0
  script:
    - gitleaks git --log-opts="--all" --no-banner --redact --exit-code 1 --report-format json --report-path gitleaks-report.json .
  artifacts:
    when: always
    paths:
      - gitleaks-report.json
    expire_in: 1 week

# Semgrep (SAST), pinned semgrep/semgrep:1.172.0. Policy: fail on ERROR
# severity only; WARNING/INFO are reported in an always-uploaded JSON
# artifact but never block the pipeline (too noisy/low-confidence to gate
# on, per Section 77's "don't wire non-actionable noise to fail the build"
# guidance).
semgrep:
  stage: security
  needs: []
  image: ${CI_DEPENDENCY_PROXY_GROUP_IMAGE_PREFIX}/semgrep/semgrep:1.172.0@sha256:65dcd4408adda7c183a6b4550cb1e9b19f7f627a6fbb7e0559bd466bedc44d7b
  script:
    - semgrep --config auto --json --output semgrep-report.json .
    - semgrep --config auto --severity ERROR --error .
  artifacts:
    when: always
    paths:
      - semgrep-report.json
    expire_in: 1 week

# Syft (SBOM generation), pinned anchore/syft:v1.51.0. Artifact-only — never
# fails the pipeline, per policy. anchore/syft's image is a distroless
# scratch image (single static binary, no shell), so it can't be used
# directly as a GitLab CI job `image:` the way trivy/gitleaks/semgrep can
# (GitLab's Docker executor needs a shell in the container to run `script:`
# lines) — instead `docker cp` the binary out of a throwaway container
# (created, never started) into this job's own docker:29 image, which does
# have a shell, then run it directly. kube-linter below hits the same
# distroless-image constraint and uses the same extraction pattern.
syft-sbom:
  stage: security
  image: ${CI_DEPENDENCY_PROXY_GROUP_IMAGE_PREFIX}/docker:29@sha256:0b6d18a4a222e71c88be6034926b4f6cde2fc33c2218643d03ccfddc65995470
  services:
    - name: ${CI_DEPENDENCY_PROXY_GROUP_IMAGE_PREFIX}/docker:29-dind@sha256:0b6d18a4a222e71c88be6034926b4f6cde2fc33c2218643d03ccfddc65995470
      alias: docker
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
  needs:
    - docker:build-images
  script:
    - docker create --name syft-extract anchore/syft:v1.51.0
    - docker cp syft-extract:/syft ./syft
    - docker rm syft-extract
    - chmod +x ./syft
    - ./syft docker-archive:manar-web-ci.tar -o cyclonedx-json > sbom.cyclonedx.json
  artifacts:
    paths:
      - sbom.cyclonedx.json
    expire_in: 1 week

# Renders this chart's manifests once (helm lint + helm template) and hands
# the rendered YAML to kubeconform/kube-linter below, so both validators
# check the exact same render.
k8s-manifests:render:
  stage: security
  needs: []
  image:
    name: ${CI_DEPENDENCY_PROXY_GROUP_IMAGE_PREFIX}/alpine/helm:4.2.3@sha256:b97ba4f9b27fe7af16ee3d37e6815783c9d4a51289b6240a9024ec471611ae9b
    entrypoint: [""]
  script:
    - helm lint deploy/helm/manar-web
    - helm template manar-web deploy/helm/manar-web --set image.tag=${CI_COMMIT_SHORT_SHA:-ci} > rendered-manifests.yaml
  artifacts:
    paths:
      - rendered-manifests.yaml
    expire_in: 1 day

# kubeconform (schema validation), pinned ghcr.io/yannh/kubeconform:v0.8.0-alpine
# — the "-alpine" tag specifically (has a shell, unlike the distroless
# default tag). Policy: fail on ANY -strict schema violation.
kubeconform:
  stage: security
  image:
    name: ghcr.io/yannh/kubeconform:v0.8.0-alpine@sha256:6b90a5f23d846140ce0194fe050b1995e546eba938f3a6bf10c039dd5e24588f
    entrypoint: [""]
  needs:
    - k8s-manifests:render
  script:
    - /kubeconform -strict -summary rendered-manifests.yaml

# kube-linter (best-practice/hardening linting), pinned
# stackrox/kube-linter:v0.8.3. Same distroless-image constraint as
# syft-sbom above (no shell) — extracted the same way. Policy: fail on any
# default-profile finding.
kube-linter:
  stage: security
  image: ${CI_DEPENDENCY_PROXY_GROUP_IMAGE_PREFIX}/docker:29@sha256:0b6d18a4a222e71c88be6034926b4f6cde2fc33c2218643d03ccfddc65995470
  services:
    - name: ${CI_DEPENDENCY_PROXY_GROUP_IMAGE_PREFIX}/docker:29-dind@sha256:0b6d18a4a222e71c88be6034926b4f6cde2fc33c2218643d03ccfddc65995470
      alias: docker
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
  needs:
    - k8s-manifests:render
  script:
    - docker create --name kube-linter-extract stackrox/kube-linter:v0.8.3
    - docker cp kube-linter-extract:/kube-linter ./kube-linter
    - docker rm kube-linter-extract
    - chmod +x ./kube-linter
    - ./kube-linter lint rendered-manifests.yaml

# Every job runs on the manar group runner (manar-ci, runner 13) and nowhere else.
# Job and service images are pinned by digest (@sha256:...): the shared runner reuses images
# already on the VM, and a digest cannot be satisfied by a retagged local copy.
default:
  # A newer pipeline on the same ref cancels this one.
  interruptible: true
  tags: [manar]
